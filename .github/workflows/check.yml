name: check
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Compile
        run: python -m py_compile dockwatch.py tools/check_profiles.py
      - name: Profiles
        run: python tools/check_profiles.py
      - name: Text modes run without hardware
        run: |
          python dockwatch.py dump --lang en
          python dockwatch.py json > /dev/null
